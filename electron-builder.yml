appId: com.github.swuecho.pgstudio-lite
productName: PgStudio Lite
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# The app bundle carries only the esbuild output. Everything read from disk at
# runtime goes in extraResources, which lands in Contents/Resources outside
# app.asar: `.node` addons cannot be required from an asar, and emscripten's
# wasm loading does not cope with the asar virtual filesystem. That is also why
# asarUnpack ends up empty.
# esbuild bundles every runtime dependency into dist-electron/main.js, so the
# asar needs no node_modules at all. Without the explicit exclusion
# electron-builder ships all production dependencies (~130 MB of dead weight).
files:
  - dist-electron/**
  - package.json
  - '!node_modules/**'
  - '!**/*.map'

extraResources:
  # The exported Next site, served by electron/static.ts.
  - from: out-desktop
    to: renderer
  # Read at runtime by lib/meta-db.ts (drizzle migrate + the 0006 hash check).
  # Includes meta/_journal.json, which the migrator requires.
  - from: drizzle/migrations
    to: drizzle/migrations
  # monaco's `min` only (~15 MB) rather than the whole 70 MB package.
  - from: node_modules/monaco-editor/min
    to: monaco/min
  - from: node_modules/@pgsql/parser/wasm/v17
    to: pgsql-parser/wasm/v17
  # Electron-ABI addon from scripts/build-sqlite-native.mjs, per arch.
  - from: native/${platform}-${arch}/better_sqlite3.node
    to: native/better_sqlite3.node

asar: true
asarUnpack: []
# Never rebuild in node_modules: it holds the Node-ABI better-sqlite3 that
# `npm test` and `next dev` depend on. See scripts/build-sqlite-native.mjs.
npmRebuild: false

mac:
  # electron-builder omits the arch from x64 macOS artifacts by default, so the
  # Intel build shipped as the unsuffixed `PgStudio Lite-<version>.dmg` and
  # looked like the default download. On Apple Silicon it runs under Rosetta
  # and is several times slower. Name every arch explicitly; these templates
  # match the default arm64 names, so only the x64 files are renamed.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Unsigned first pass: no hardenedRuntime/entitlements/notarization yet.
  identity: null

dmg:
  title: ${productName}
  artifactName: ${productName}-${version}-${arch}.${ext}

# x64 only for now: that is what the runners in .github/workflows/release.yml
# are, and `${platform}-${arch}` in extraResources means each OS has to package
# on its own platform anyway.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-win.${ext}

nsis:
  # Assisted installer (per-user, choice of directory) rather than one-click.
  oneClick: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: Hao Wu <echowuhao@gmail.com>
  # No spaces in Linux file names; ${name} is the package.json name.
  artifactName: ${name}-${version}-${arch}.${ext}

# `electron-builder --publish always` (the release workflow, on a version tag)
# uploads every artifact to a draft GitHub release named after the tag. The
# draft is published by hand after a look at the assets. Owner/repo come from
# package.json's `repository` field.
publish:
  provider: github
  releaseType: draft
