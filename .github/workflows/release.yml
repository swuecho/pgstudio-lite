name: Release

# Builds the desktop app for macOS (arm64 + x64), Windows (x64) and Linux (x64).
#
#  - A `v*` tag (e.g. v0.4.0) builds every platform and uploads the artifacts to
#    a draft GitHub release named after the tag. Publish the draft by hand.
#  - The tag is the version. It is written into package.json before packaging
#    (not committed), so the file's own `version` field is irrelevant here.
#  - Manual runs (workflow_dispatch) build everything and keep the artifacts on
#    the workflow run only; nothing is published.
#
# Each OS packages on its own runner: electron-builder.yml picks the Electron-ABI
# better-sqlite3 addon from `native/${platform}-${arch}`, and `${platform}` is
# the build host, not the target.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # identity is null in electron-builder.yml; this also stops the mac runner
  # from looking for a signing certificate at all.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  draft-release:
    # electron-builder would create the draft itself, but with three jobs (and
    # both mac architectures inside one job) publishing at the same moment each
    # saw "no release yet" and created its own. Create it once, up front, so
    # every job uploads into the same draft.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; electron-builder will use it if it is still a draft"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    # Manual runs skip draft-release; still build.
    if: always() && (needs.draft-release.result == 'success' || needs.draft-release.result == 'skipped')
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Fetch Electron-ABI better-sqlite3
        run: npm run desktop:native

      - name: Fetch Electron-ABI better-sqlite3 (macOS x64)
        # The mac job packages both architectures; prebuild-install can fetch
        # the other arch's addon without building anything.
        if: runner.os == 'macOS'
        run: npm run desktop:native
        env:
          PGSTUDIO_NATIVE_ARCH: x64

      - name: Install xvfb
        # The icon is rasterized by Electron, which needs a display on Linux.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Generate app icon
        shell: bash
        # Linux: no display without xvfb, and Electron's SUID sandbox helper is
        # not installed with root ownership under node_modules, so the sandbox
        # must be disabled for this one headless run.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run desktop:icon -- --no-sandbox
          else
            npm run desktop:icon
          fi

      - name: Build static renderer
        run: npm run desktop:renderer

      - name: Build Electron main process
        run: npm run desktop:main

      - name: Package
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then publish=always; else publish=never; fi
          case "$RUNNER_OS" in
            macOS)   npx electron-builder --mac   --publish "$publish" ;;
            Windows) npx electron-builder --win   --publish "$publish" ;;
            Linux)   npx electron-builder --linux --publish "$publish" ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pgstudio-lite-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
