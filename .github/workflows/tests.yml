name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks run once here; the jobs below only run if they pass.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  desktop-build:
    # The desktop static export and the Electron main bundle are only exercised
    # by `npm run desktop:*`, so build both here. Without this, a change to
    # pages/api or electron/ could break the packaged app while CI stays green.
    needs: checks
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Electron-ABI better-sqlite3
        run: npm run desktop:native

      - name: Build static renderer
        run: npm run desktop:renderer

      - name: Build Electron main process
        run: npm run desktop:main

      - name: Smoke-test the desktop app
        # The renderer needs a window server; xvfb is Linux-only, so this runs
        # on macOS where the runner provides one.
        run: npx electron . --smoke --user-data-dir "$RUNNER_TEMP/pgstudio-smoke"

      - name: Show smoke log
        if: always()
        run: cat "$RUNNER_TEMP/pgstudio-smoke/smoke.log" || true

  pg-integration:
    needs: checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGSTUDIO_PG_INTEGRATION: '1'
      PG_CONNECTION_STRING: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PG_CONNECTION_NAME: default
      PG_CONNECTION_READ_ONLY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postgres integration tests
        run: npm run test:integration
